name: CI

on:
  push:
    branches: [JJ]
  pull_request:
    branches: [main]

# Solo lectura del repositorio: el workflow no publica nada ni usa secretos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Mostrar la versión del SDK
        run: dotnet --version

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar en Release
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar las pruebas
        run: dotnet test --configuration Release --no-build

  sqlserver:
    name: Probar contra SQL Server efímero
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar SQL Server 2022 desechable
        run: |
          # Contraseña aleatoria de este trabajo: no es un secreto del repositorio y el contenedor se destruye al terminar.
          password="Fx$(openssl rand -hex 16)9!"
          echo "::add-mask::$password"
          docker run --detach --name sqlserver \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env "MSSQL_SA_PASSWORD=$password" \
            --publish 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718 # 2022-latest
          echo "FIXTRACK_TEST_SQLSERVER_SERVER=Server=127.0.0.1,1433;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True;" >> "$GITHUB_ENV"

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restaurar y compilar
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Esperar a SQL Server
        run: |
          for _ in $(seq 1 60); do
            docker logs sqlserver 2>&1 | grep -q "SQL Server is now ready for client connections" && exit 0
            sleep 2
          done
          docker logs sqlserver 2>&1 | tail -n 40
          exit 1

      - name: Ejecutar las pruebas de SQL Server
        # Cada ejecución crea una base con nombre único, aplica las migraciones, carga datos ficticios y la elimina.
        run: dotnet test --configuration Release --no-build -- --filter-namespace FixTrack.Tests.SqlServer

      - name: Registro de SQL Server
        if: failure()
        run: docker logs sqlserver 2>&1 | tail -n 40 || true

  docker:
    name: Construir y probar la imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir la imagen (no se publica)
        run: docker build --tag fixtrack:ci .

      - name: Comprobar que la imagen se ejecuta sin privilegios
        run: |
          user="$(docker image inspect fixtrack:ci --format '{{.Config.User}}')"
          echo "Usuario de la imagen: $user"
          test "$user" != "" && test "$user" != "0" && test "$user" != "root"

      - name: Probar el contenedor sin base de datos
        run: |
          # Certificado desechable de esta ejecución para Data Protection (producción exige uno); no es del repositorio.
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 -subj "/CN=FixTrack CI" 2> /dev/null
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out dp.pfx -passout "pass:$password"
          DataProtection__Certificate__Base64="$(base64 -w0 dp.pfx)"
          DataProtection__Certificate__Password="$password"
          export DataProtection__Certificate__Base64 DataProtection__Certificate__Password
          rm key.pem cert.pem dp.pfx
          # Cadena ficticia: la imagen no trae credenciales y el contenedor debe arrancar igual.
          docker run --detach --name fixtrack --publish 8080:9000 \
            --env PORT=9000 \
            --env ReverseProxy__IgnoreForwardedHeaders=true \
            --env DataProtection__Certificate__Base64 \
            --env DataProtection__Certificate__Password \
            --env ConnectionStrings__FixTrack="Server=no-existe.invalid;Database=NoUsar;Encrypt=True;" \
            fixtrack:ci
          for _ in $(seq 1 60); do
            curl --silent --fail http://localhost:8080/salud > /dev/null && break
            sleep 2
          done
          test "$(curl --silent http://localhost:8080/salud)" = "Healthy"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/salud/bd)" = "503"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/clientes)" = "302"

      - name: Sin base, las páginas responden 503 breve y la bitácora no se inunda
        run: |
          # El inicio de sesión necesita las claves de Data Protection, guardadas en la base: debe responder 503 con
          # Retry-After y una página sin detalles técnicos.
          headers="$(curl --silent --dump-header - --output pagina.html http://localhost:8080/cuenta/iniciar-sesion)"
          echo "$headers" | grep -qi "^HTTP/1.1 503"
          echo "$headers" | grep -qi "^retry-after:"
          grep -q "Servicio temporalmente no disponible" pagina.html
          if grep -qi "exception" pagina.html; then echo "La página 503 muestra detalles técnicos"; exit 1; fi
          # Con el disyuntor abierto, cada solicitud rechazada deja una línea breve (antes, cuatro trazas completas).
          antes="$(docker logs fixtrack 2>&1 | wc -l)"
          for _ in $(seq 1 10); do curl --silent --output /dev/null http://localhost:8080/cuenta/iniciar-sesion; done
          despues="$(docker logs fixtrack 2>&1 | wc -l)"
          echo "Líneas de bitácora por 10 solicitudes rechazadas: $((despues - antes))"
          test $((despues - antes)) -le 30

      - name: Un contenedor mal configurado termina con error
        run: |
          # Sin certificado de Data Protection, producción no arranca. Como PID 1, el proceso debe salir con un código
          # de error (y no quedar colgado), para que la plataforma muestre el fallo.
          docker run --detach --name sin-certificado \
            --env ReverseProxy__IgnoreForwardedHeaders=true \
            --env ConnectionStrings__FixTrack="Server=no-existe.invalid;Database=NoUsar;Encrypt=True;" \
            fixtrack:ci
          for _ in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Status}}' sin-certificado)" = "exited" && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Status}}' sin-certificado)" = "exited"
          test "$(docker inspect --format '{{.State.ExitCode}}' sin-certificado)" = "1"
          docker logs sin-certificado 2>&1 | grep -q "DataProtection__Certificate__Base64"

      - name: Registro del contenedor
        if: always()
        run: docker logs fixtrack 2>&1 | tail -n 40 || true

  demo:
    name: Probar la demostración local
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar la demostración desde cero (Docker Compose)
        run: |
          # demo.sh genera contraseñas aleatorias de este trabajo y las muestra al final: se ocultan antes de mostrar
          # el registro. El entorno usa solo su propio SQL Server y se elimina al terminar.
          status=0
          ./demo/demo.sh iniciar > demo-inicio.log 2>&1 || status=$?
          if [ -f demo/.env ]; then
            for secret in $(sed -n 's/^DEMO_[A-Z_]*PASSWORD=//p' demo/.env); do echo "::add-mask::$secret"; done
          fi
          cat demo-inicio.log
          exit $status

      - name: Comprobar datos, extras y permisos de cada rol
        run: ./demo/demo.sh verificar

      - name: Volver a iniciar sin perder los datos
        run: |
          ./demo/demo.sh detener
          ./demo/demo.sh iniciar > demo-reinicio.log 2>&1
          grep -q "ya contiene la demostración completa" demo-reinicio.log
          ./demo/demo.sh verificar

      - name: Registro de la demostración
        if: failure()
        run: docker compose --file demo/compose.yaml logs --tail 60 || true

      - name: Eliminar la demostración
        if: always()
        run: ./demo/demo.sh eliminar || true
